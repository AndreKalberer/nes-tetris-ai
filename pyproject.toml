[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nes-tetris-ai"
version = "0.0.0"
description = "A bot that plays the original NES Tetris cartridge to level 255 and beyond, for score"
requires-python = ">=3.13"

[tool.setuptools]
packages = ["nes", "nes_original"]
include-package-data = false

[tool.setuptools.package-dir]
nes = "nes-bot/nes"
nes_original = "nes-bot/nes_original"
