[pytest]
testpaths = nes-bot/tests
# nes-bot is the import root, so `import nes_original` works without installing anything.
pythonpath = nes-bot
addopts = --basetemp=.pytest-work
# Optional: `pip install -e .` once per Python environment makes the bot packages importable
# from any folder, so commands such as `python -m nes_original.endurance` keep working.
# Without it, run from the repository root with PYTHONPATH set (the launchers do this).
